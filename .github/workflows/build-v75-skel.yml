# Builds libdit_engine.so + HTP skels (incl. v75 for 8Gen3/SM8650) on
# GitHub-hosted x64 Linux. Manual trigger only.
#
# Prereqs (all handled inside): submodules for stable-diffusion.cpp,
# Android NDK r28b, repackaged Hexagon SDK 6.6.0.0 (no login needed).
# Branch 8gen3-v75 already carries the v75 CMake/build.sh changes, so this
# just runs the official build.sh and uploads the artifacts.
name: build-v75-skel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (no submodules yet)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init stable-diffusion.cpp submodule only
        run: git submodule update --init --recursive app/src/main/cpp/3rdparty/stable-diffusion.cpp

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --version
          ninja --version

      - name: Install Android NDK r28b
        run: |
          cd "$HOME"
          curl -L --fail --retry 3 -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q ndk.zip
          test -f "$HOME/android-ndk-r28b/build/cmake/android.toolchain.cmake"

      - name: Install Hexagon SDK 6.6.0.0 (community repack, no login)
        run: |
          cd "$HOME"
          curl -L --fail --retry 3 -o hex.tar.xz \
            https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.6.0.0/hexagon-sdk-v6.6.0.0-amd64-lnx.tar.xz
          mkdir -p "$HOME/hexagon"
          tar -xaf hex.tar.xz -C "$HOME/hexagon"
          ls "$HOME/hexagon"
          test -f "$HOME/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
          echo "HEXAGON_TOOLS candidates:"
          ls "$HOME/hexagon/6.6.0.0/tools/HEXAGON_Tools/" || true

      - name: Build dit engine + skels (official build.sh)
        run: |
          export ANDROID_NDK_ROOT="$HOME/android-ndk-r28b"
          export HEXAGON_SDK_ROOT="$HOME/hexagon/6.6.0.0"
          # Prefer explicit tools root if auto-detect via hexagon_sdk.json fails.
          HEX_TOOLS_CANDIDATE="$(ls -d "$HOME"/hexagon/6.6.0.0/tools/HEXAGON_Tools/*/ 2>/dev/null | head -n 1 || true)"
          if [ -n "$HEX_TOOLS_CANDIDATE" ]; then
            export HEXAGON_TOOLS_ROOT="$HEX_TOOLS_CANDIDATE"
          fi
          echo "HEXAGON_TOOLS_ROOT=${HEXAGON_TOOLS_ROOT:-<auto>}"
          bash app/src/main/cpp/dit/build.sh

      - name: Verify v75 skel present
        run: |
          ls -la app/src/main/assets/ditlibs/
          test -f app/src/main/assets/ditlibs/libggml-htp-v75.so
          file app/src/main/assets/ditlibs/libggml-htp-v75.so || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dit-v75-8gen3
          path: |
            app/src/main/jniLibs/arm64-v8a/libdit_engine.so
            app/src/main/assets/ditlibs/libggml-htp-v75.so
            app/src/main/assets/ditlibs/libggml-htp-v79.so
            app/src/main/assets/ditlibs/libggml-htp-v81.so
